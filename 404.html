<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page introuvable · Eddie Zida</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a90d9'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='26' fill='white'%3EEZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root { --bg: #f0f5fb; --ink: #111827; --muted: #55677f; --blue: #4a90d9; --blue-dark: #2d6fad; --blue-deep: #245a8d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--ink);
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background-image: radial-gradient(circle, rgba(74,144,217,.15) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .code { font-family: 'JetBrains Mono', monospace; color: var(--blue-dark); font-size: .95rem; margin-bottom: 10px; }
    h1 { font-size: clamp(3.5rem, 12vw, 6rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    h1 span { color: var(--blue); }
    p { color: var(--muted); margin: 16px auto 28px; max-width: 460px; line-height: 1.6; }
    a {
      display: inline-block; background: var(--blue-dark); color: #fff; text-decoration: none;
      padding: 12px 24px; border-radius: 10px; font-weight: 700; transition: background .2s;
    }
    a:hover { background: var(--blue-deep); }
    a:focus-visible { outline: 3px solid var(--blue-dark); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">&gt; GET /page · 404</div>
    <h1>4<span>0</span>4</h1>
    <p>Cette page n'existe pas ou a été déplacée.<br><span lang="en">This page doesn't exist or has moved.</span></p>
    <a href="/">Retour au portfolio · Back to portfolio</a>
  </main>
</body>
</html>
